<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Masti Music neon Bollywood night</title>
  <desc id="desc">A neon night music backdrop with a glowing sun, equalizer bars, cassette reels and colorful sound waves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#241642"/>
      <stop offset="0.48" stop-color="#4b1f58"/>
      <stop offset="1" stop-color="#071f3d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff7b54"/>
      <stop offset="1" stop-color="#ff4f81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d7c4"/>
      <stop offset="0.5" stop-color="#65f2d2"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#fff4df" opacity=".16"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1120" cy="260" r="270" fill="#ff4f81" opacity=".22" filter="url(#blur)"/>
  <circle cx="1120" cy="260" r="230" fill="url(#sun)" opacity=".9"/>
