<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arijit Diaries abstract soundscape</title>
  <desc id="desc">A deep blue, coral, gold and teal abstract background inspired by music, records and night lights.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102340"/>
      <stop offset="0.55" stop-color="#1d4770"/>
      <stop offset="1" stop-color="#102d4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff8a70" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ff6b5f" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff6b5f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#fff4df" opacity=".12"/>
      <circle cx="27" cy="31" r="1" fill="#ffd166" opacity=".1"/>
      <path d="M12 42l5-5M38 12l3-3" stroke="#fff4df" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <circle cx="1180" cy="300" r="390" fill="url(#glow)"/>
  <path d="M-80 690 C180 510 310 790 560 610 S930 440 1130 630 S1420 790 1700 500" fill="none" stroke="#18a6a1" stroke-width="92" opacity=".28"/>
  <path d="M-70 760 C190 580 320 850 590 660 S950 500 1170 690 S1450 840 1680 590" fill="none" stroke="#ffd166" stroke-width="3" opacity=".8"/>
  <path d="M-70 790 C190 610 320 880 590 690 S950 530 1170 720 S1450 870 1680 620" fill="none" stroke="#ff6b5f" stroke-width="3" opacity=".75"/>
  <g transform="translate(1120 170)" fill="none" stroke="#fff4df" stroke-width="5" opacity=".82">
    <circle cx="80" cy="80" r="64"/>
    <circle cx="80" cy="80" r="27" stroke="#ffd166"/>
    <path d="M80 16V144M16 80h128M35 35l90 90M125 35l-90 90" opacity=".45"/>
  </g>
  <g fill="#ffd166" opacity=".92">
    <circle cx="310" cy="170" r="8"/><circle cx="310" cy="170" r="29" fill="none" stroke="#ffd166" stroke-width="5"/>
    <circle cx="410" cy="275" r="7"/><circle cx="410" cy="275" r="25" fill="none" stroke="#ffd166" stroke-width="5"/>
    <circle cx="1350" cy="650" r="8"/><circle cx="1350" cy="650" r="30" fill="none" stroke="#ffd166" stroke-width="5"/>
  </g>
  <g stroke="#fff4df" stroke-width="2" opacity=".22">
    <path d="M100 120h250M100 140h180M1260 120h220M1260 140h150"/>
    <path d="M160 240h130M1320 760h170M110 820h240"/>
  </g>
  <rect width="1600" height="900" fill="url(#grain)"/>
